              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          BUCKET="${1:-}"

          if [ -z "$BUCKET" ]; then
              echo "Usage: $0 <bucket-name>"
              exit 1
          fi

          if ! command -v aws >/dev/null 2>&1; then
              echo "AWS CLI is not installed."
              exit 1
          fi

          if aws s3 ls "s3://$BUCKET" >/dev/null 2>&1; then
              echo "SUCCESS: Bucket is accessible."
          else
              echo "ERROR: Bucket is not accessible."
              exit 1
          fi
          SCRIPT
              ;;

            51)
              FILE="scripts/${NUMBER}_check_process_and_restart.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          PROCESS_NAME="${1:-nginx}"
          SERVICE_NAME="${2:-nginx}"

          if pgrep -x "$PROCESS_NAME" >/dev/null 2>&1; then
              echo "$PROCESS_NAME is running."
          else
              echo "$PROCESS_NAME is not running."
              echo "Attempting to restart $SERVICE_NAME..."

              sudo systemctl restart "$SERVICE_NAME"

              sleep 5

              if pgrep -x "$PROCESS_NAME" >/dev/null 2>&1; then
                  echo "$PROCESS_NAME restarted successfully."
              else
                  echo "ERROR: Failed to restart $PROCESS_NAME."
                  exit 1
              fi
          fi
          SCRIPT
              ;;

            *)
              echo "Invalid use case."
              exit 1
              ;;

          esac

          chmod +x "$FILE"

          echo "Generated: $FILE"

      - name: Validate shell script
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT=$(find scripts \
            -maxdepth 1 \
            -type f \
            -name '[0-9][0-9][0-9]_*.sh' |
            sort |
            tail -1)

          echo "Validating $SCRIPT"

          bash -n "$SCRIPT"

          echo "Syntax validation successful."

      - name: Update README
        shell: bash
        run: |
          set -euo pipefail

          COUNT=$(find scripts \
            -maxdepth 1 \
            -type f \
            -name '[0-9][0-9][0-9]_*.sh' |
            wc -l)

          cat > README.md <<EOF
          # ShellScript

          A collection of practical Shell scripting examples for Linux, DevOps, AWS, Docker and Kubernetes.

          ## Topics

