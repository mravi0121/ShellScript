          #!/bin/bash

          # ==========================================================
          # Script Name : check_process_and_restart.sh
          # Description : Monitor a process and restart it if required
          # ==========================================================

          set -euo pipefail

          PROCESS_NAME="${1:-nginx}"

          RESTART_COMMAND="${2:-systemctl restart nginx}"

          LOG_FILE="${3:-/tmp/process-auto-restart.log}"

          log() {
              echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" |
                  tee -a "$LOG_FILE"
          }

          log "Checking process: $PROCESS_NAME"

          if pgrep -x "$PROCESS_NAME" >/dev/null 2>&1; then

              log "$PROCESS_NAME is running."
              exit 0

          fi

          log "WARNING: $PROCESS_NAME is not running."

          log "Attempting automatic restart..."

          eval "$RESTART_COMMAND"

          sleep 5

          if pgrep -x "$PROCESS_NAME" >/dev/null 2>&1; then

              log "SUCCESS: $PROCESS_NAME restarted successfully."

          else

              log "ERROR: Failed to restart $PROCESS_NAME."
              exit 1

