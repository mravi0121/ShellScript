name: Daily Shell Script

on:
  schedule:
    # Every day at 1:00 AM IST
    # 1:00 AM IST = 7:30 PM UTC (previous day)
    - cron: "30 19 * * *"

  # Allows manual execution from:
  # GitHub -> Actions -> Daily Shell Script -> Run workflow
  workflow_dispatch:

# Allow GitHub Actions to commit and push files
permissions:
  contents: write

jobs:
  generate-shell-script:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Configure Git
      # ==========================================================

      - name: Configure Git
        run: |
          git config user.name "mravi0121"
          git config user.email "ravimishra121299@gmail.com"

      # ==========================================================
      # 3. Generate the next Shell Script
      # ==========================================================

      - name: Generate daily shell script
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p scripts

          # ------------------------------------------------------
          # Count already generated scripts
          # ------------------------------------------------------

          EXISTING_COUNT=$(find scripts \
            -maxdepth 1 \
            -type f \
            -name '[0-9][0-9][0-9]_*.sh' \
            | wc -l)

          NEXT_NUMBER=$((EXISTING_COUNT + 1))

          echo "Existing scripts : $EXISTING_COUNT"
          echo "Next script      : $NEXT_NUMBER"

          # ------------------------------------------------------
          # Stop after all 51 use cases
          # ------------------------------------------------------

          if [ "$NEXT_NUMBER" -gt 51 ]; then
            echo "=========================================="
            echo "All 51 use cases have been completed."
            echo "No new script will be generated."
            echo "=========================================="
            exit 0
          fi

          # ------------------------------------------------------
          # Format script number
          # ------------------------------------------------------

          NUMBER=$(printf "%03d" "$NEXT_NUMBER")

          echo "Generating use case #$NUMBER"

          # ------------------------------------------------------
          # Select use case
          # ------------------------------------------------------

          case "$NEXT_NUMBER" in

            # ====================================================
            # 001 - Disk Usage
            # ====================================================

            1)

              FILE="scripts/${NUMBER}_check_disk_usage.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_disk_usage.sh
          # Description : Check disk usage and warn above threshold
          # ==========================================================

          set -euo pipefail

          THRESHOLD=80

          echo "Checking disk usage..."
          echo

          df -hP | awk -v threshold="$THRESHOLD" '
          NR > 1 {
              usage=$5
              gsub("%","",usage)

              if (usage >= threshold) {
                  print "WARNING: " $6 " is " usage "% full"
              } else {
                  print "OK: " $6 " is " usage "% full"
              }
          }'
          SCRIPT

              ;;

            # ====================================================
            # 002 - CPU Usage
            # ====================================================

            2)

              FILE="scripts/${NUMBER}_check_cpu_usage.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_cpu_usage.sh
          # Description : Check CPU utilization
          # ==========================================================

          set -euo pipefail

          CPU_USAGE=$(top -bn1 | awk '/Cpu\(s\)/ {
              print 100 - $8
          }')

          echo "CPU Usage: ${CPU_USAGE}%"
          SCRIPT

              ;;

            # ====================================================
            # 003 - Memory Usage
            # ====================================================

            3)

              FILE="scripts/${NUMBER}_check_memory_usage.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_memory_usage.sh
          # Description : Check memory utilization
          # ==========================================================

          set -euo pipefail

          free -h

          MEMORY_USAGE=$(free | awk '/Mem:/ {
              printf "%.0f", ($3/$2)*100
          }')

          echo
          echo "Memory Usage: ${MEMORY_USAGE}%"

          if [ "$MEMORY_USAGE" -ge 80 ]; then
              echo "WARNING: Memory usage is above 80%"
          else
              echo "OK: Memory usage is normal"
          fi
          SCRIPT

              ;;

            # ====================================================
            # 004 - Load Average
            # ====================================================

            4)

              FILE="scripts/${NUMBER}_check_load_average.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_load_average.sh
          # Description : Check system load average
          # ==========================================================

          set -euo pipefail

          echo "Load Average:"
          uptime

          echo
          echo "Detailed Load Average:"
          cat /proc/loadavg
          SCRIPT

              ;;

            # ====================================================
            # 005 - Uptime
            # ====================================================

            5)

              FILE="scripts/${NUMBER}_check_uptime.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_uptime.sh
          # Description : Display system uptime
          # ==========================================================

          set -euo pipefail

          echo "System Uptime:"
          uptime -p

          echo
          echo "System Boot Time:"
          uptime -s
          SCRIPT

              ;;

            # ====================================================
            # 006 - Top CPU Processes
            # ====================================================

            6)

              FILE="scripts/${NUMBER}_top_cpu_processes.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : top_cpu_processes.sh
          # Description : Find top CPU-consuming processes
          # ==========================================================

          set -euo pipefail

          echo "Top CPU-consuming processes:"
          echo

          ps aux --sort=-%cpu | head -11
          SCRIPT

              ;;

            # ====================================================
            # 007 - Top Memory Processes
            # ====================================================

            7)

              FILE="scripts/${NUMBER}_top_memory_processes.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : top_memory_processes.sh
          # Description : Find top memory-consuming processes
          # ==========================================================

          set -euo pipefail

          echo "Top memory-consuming processes:"
          echo

          ps aux --sort=-%mem | head -11
          SCRIPT

              ;;

            # ====================================================
            # 008 - Kill Process
            # ====================================================

            8)

              FILE="scripts/${NUMBER}_kill_process.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : kill_process.sh
          # Description : Safely terminate a process
          # ==========================================================

          set -euo pipefail

          PID="${1:-}"

          if [ -z "$PID" ]; then
              echo "Usage: $0 <PID>"
              exit 1
          fi

          if ! kill -0 "$PID" 2>/dev/null; then
              echo "Process $PID does not exist."
              exit 1
          fi

          echo "Sending SIGTERM to process $PID..."

          kill "$PID"

          echo "Termination signal sent successfully."
          SCRIPT

              ;;

            # ====================================================
            # 009 - Service Status
            # ====================================================

            9)

              FILE="scripts/${NUMBER}_check_service_status.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_service_status.sh
          # Description : Check Linux systemd service status
          # ==========================================================

          set -euo pipefail

          SERVICE="${1:-ssh}"

          if systemctl is-active --quiet "$SERVICE"; then
              echo "SUCCESS: $SERVICE is running."
          else
              echo "ERROR: $SERVICE is not running."
              exit 1
          fi
          SCRIPT

              ;;

            # ====================================================
            # 010 - Auto Restart Tomcat
            # ====================================================

            10)

              FILE="scripts/${NUMBER}_auto_restart_tomcat.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : auto_restart_tomcat.sh
          # Description : Automatically restart Tomcat if it fails
          # ==========================================================

          set -euo pipefail

          SERVICE="${1:-tomcat}"
          LOG_FILE="${2:-/tmp/tomcat-auto-restart.log}"

          log() {
              echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" | tee -a "$LOG_FILE"
          }

          log "Checking $SERVICE service..."

          if systemctl is-active --quiet "$SERVICE"; then
              log "$SERVICE is running."
              exit 0
          fi

          log "WARNING: $SERVICE is down."
          log "Attempting to restart $SERVICE..."

          systemctl restart "$SERVICE"

          sleep 10

          if systemctl is-active --quiet "$SERVICE"; then
              log "SUCCESS: $SERVICE restarted successfully."
              exit 0
          fi

          log "ERROR: Failed to restart $SERVICE."

          systemctl status "$SERVICE" \
              --no-pager \
              >> "$LOG_FILE" 2>&1 || true

          exit 1
          SCRIPT

              ;;

            # ====================================================
            # 011 - Failed Services
            # ====================================================

            11)

              FILE="scripts/${NUMBER}_check_failed_services.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_failed_services.sh
          # Description : List failed systemd services
          # ==========================================================

          set -euo pipefail

          echo "Checking failed systemd services..."
          echo

          systemctl --failed --no-pager
          SCRIPT

              ;;

            # ====================================================
            # 012 - Open Ports
            # ====================================================

            12)

              FILE="scripts/${NUMBER}_check_open_ports.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_open_ports.sh
          # Description : Display listening network ports
          # ==========================================================

          set -euo pipefail

          echo "Listening TCP/UDP ports:"
          echo

          ss -tuln
          SCRIPT

              ;;

            # ====================================================
            # 013 - Network Connectivity
            # ====================================================

            13)

              FILE="scripts/${NUMBER}_check_network_connectivity.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_network_connectivity.sh
          # Description : Test connectivity to a host
          # ==========================================================

          set -euo pipefail

          HOST="${1:-google.com}"

          echo "Testing connectivity to $HOST..."

          if ping -c 3 "$HOST" >/dev/null 2>&1; then
              echo "SUCCESS: Network connectivity is working."
          else
              echo "ERROR: Network connectivity failed."
              exit 1
          fi
          SCRIPT

              ;;

            # ====================================================
            # 014 - DNS Resolution
            # ====================================================

            14)

              FILE="scripts/${NUMBER}_check_dns_resolution.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_dns_resolution.sh
          # Description : Check DNS resolution
          # ==========================================================

          set -euo pipefail

          DOMAIN="${1:-google.com}"

          echo "Resolving $DOMAIN..."

          if getent hosts "$DOMAIN"; then
              echo "SUCCESS: DNS resolution is working."
          else
              echo "ERROR: DNS resolution failed."
              exit 1
          fi
          SCRIPT

              ;;

            # ====================================================
            # 015 - HTTP Endpoint
            # ====================================================

            15)

              FILE="scripts/${NUMBER}_check_http_endpoint.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_http_endpoint.sh
          # Description : Check HTTP endpoint health
          # ==========================================================

          set -euo pipefail

          URL="${1:-https://example.com}"

          HTTP_STATUS=$(curl -L -s \
              -o /dev/null \
              -w "%{http_code}" \
              "$URL")

          echo "URL         : $URL"
          echo "HTTP Status : $HTTP_STATUS"

          if [[ "$HTTP_STATUS" =~ ^[23][0-9][0-9]$ ]]; then
              echo "SUCCESS: Endpoint is healthy."
          else
              echo "ERROR: Endpoint returned HTTP $HTTP_STATUS."
              exit 1
          fi
          SCRIPT

              ;;

            # ====================================================
            # 016 - Large Files
            # ====================================================

            16)

              FILE="scripts/${NUMBER}_find_large_files.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : find_large_files.sh
          # Description : Find files larger than specified size
          # ==========================================================

          set -euo pipefail

          DIRECTORY="${1:-.}"
          SIZE="${2:-100M}"

          echo "Files larger than $SIZE:"
          echo

          find "$DIRECTORY" \
              -type f \
              -size +"$SIZE" \
              -exec ls -lh {} \;
          SCRIPT

              ;;

            # ====================================================
            # 017 - Recent Files
            # ====================================================

            17)

              FILE="scripts/${NUMBER}_find_recent_files.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : find_recent_files.sh
          # Description : Find files modified within 24 hours
          # ==========================================================

          set -euo pipefail

          DIRECTORY="${1:-.}"

          echo "Files modified within the last 24 hours:"
          echo

          find "$DIRECTORY" \
              -type f \
              -mtime -1 \
              -print
          SCRIPT

              ;;

            # ====================================================
            # 018 - Old Files
            # ====================================================

            18)

              FILE="scripts/${NUMBER}_find_old_files.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : find_old_files.sh
          # Description : Find files older than specified days
          # ==========================================================

          set -euo pipefail

          DIRECTORY="${1:-.}"
          DAYS="${2:-30}"

          echo "Files older than $DAYS days:"
          echo

          find "$DIRECTORY" \
              -type f \
              -mtime +"$DAYS" \
              -print
          SCRIPT

              ;;

            # ====================================================
            # 019 - Cleanup Old Logs
            # ====================================================

            19)

              FILE="scripts/${NUMBER}_cleanup_old_logs.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : cleanup_old_logs.sh
          # Description : Find old log files for cleanup
          # ==========================================================

          set -euo pipefail

          LOG_DIR="${1:-/var/log}"
          DAYS="${2:-30}"

          echo "Log files older than $DAYS days:"
          echo

          find "$LOG_DIR" \
              -type f \
              -name "*.log" \
              -mtime +"$DAYS" \
              -print

          echo
          echo "Review files before enabling deletion."
          SCRIPT

              ;;

            # ====================================================
            # 020 - Archive Logs
            # ====================================================

            20)

              FILE="scripts/${NUMBER}_archive_logs.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : archive_logs.sh
          # Description : Compress a log directory
          # ==========================================================

          set -euo pipefail

          LOG_DIR="${1:-/tmp/logs}"
          OUTPUT_DIR="${2:-$HOME/log-archives}"

          if [ ! -d "$LOG_DIR" ]; then
              echo "Directory not found: $LOG_DIR"
              exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')

          ARCHIVE="$OUTPUT_DIR/logs_$TIMESTAMP.tar.gz"

          tar -czf "$ARCHIVE" "$LOG_DIR"

          echo "Archive created:"
          echo "$ARCHIVE"
          SCRIPT

              ;;

            # ====================================================
            # 021 - Search Error Logs
            # ====================================================

            21)

              FILE="scripts/${NUMBER}_search_error_logs.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : search_error_logs.sh
          # Description : Search logs for ERROR/WARN/FAILED
          # ==========================================================

          set -euo pipefail

          LOG_FILE="${1:-/var/log/syslog}"

          if [ ! -f "$LOG_FILE" ]; then
              echo "Log file not found: $LOG_FILE"
              exit 1
          fi

          grep -Ei \
              "error|warn|failed|critical" \
              "$LOG_FILE" || true
          SCRIPT

              ;;

            # ====================================================
            # 022 - Monitor Log
            # ====================================================

            22)

              FILE="scripts/${NUMBER}_monitor_log_file.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : monitor_log_file.sh
          # Description : Monitor log file for errors
          # ==========================================================

          set -euo pipefail

          LOG_FILE="${1:-/var/log/syslog}"

          if [ ! -f "$LOG_FILE" ]; then
              echo "Log file not found: $LOG_FILE"
              exit 1
          fi

          echo "Monitoring $LOG_FILE..."
          echo "Press Ctrl+C to stop."

          tail -F "$LOG_FILE" |
              grep --line-buffered \
              -Ei "error|failed|critical"
          SCRIPT

              ;;

            # ====================================================
            # 023 - HTTP Status Analysis
            # ====================================================

            23)

              FILE="scripts/${NUMBER}_analyze_http_status_codes.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : analyze_http_status_codes.sh
          # Description : Count HTTP status codes from access log
          # ==========================================================

          set -euo pipefail

          LOG_FILE="${1:-access.log}"

          if [ ! -f "$LOG_FILE" ]; then
              echo "Log file not found: $LOG_FILE"
              exit 1
          fi

          echo "HTTP status code summary:"
          echo

          awk '{
              for (i=1; i<=NF; i++) {
                  if ($i ~ /^[1-5][0-9][0-9]$/) {
                      print $i
                  }
              }
          }' "$LOG_FILE" |
              sort |
              uniq -c |
              sort -nr
          SCRIPT

              ;;

            # ====================================================
            # 024 - Failed SSH Logins
            # ====================================================

            24)

              FILE="scripts/${NUMBER}_check_failed_ssh_logins.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_failed_ssh_logins.sh
          # Description : Find failed SSH login attempts
          # ==========================================================

          set -euo pipefail

          echo "Failed SSH login attempts:"
          echo

          if [ -f /var/log/auth.log ]; then

              grep "Failed password" \
                  /var/log/auth.log || true

          elif [ -f /var/log/secure ]; then

              grep "Failed password" \
                  /var/log/secure || true

          else

              echo "Authentication log not found."

          fi
          SCRIPT

              ;;

            # ====================================================
            # 025 - Inode Usage
            # ====================================================

            25)

              FILE="scripts/${NUMBER}_check_inode_usage.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_inode_usage.sh
          # Description : Check inode utilization
          # ==========================================================

          set -euo pipefail

          echo "Filesystem inode usage:"
          echo

          df -ih
          SCRIPT

              ;;

            # ====================================================
            # 026 - Large Directories
            # ====================================================

            26)

              FILE="scripts/${NUMBER}_find_large_directories.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : find_large_directories.sh
          # Description : Find directories consuming most space
          # ==========================================================

          set -euo pipefail

          DIRECTORY="${1:-.}"

          echo "Largest directories:"
          echo

          du -h \
              --max-depth=1 \
              "$DIRECTORY" 2>/dev/null |
              sort -hr |
              head -20
          SCRIPT

              ;;

            # ====================================================
            # 027 - File Permissions
            # ====================================================

            27)

              FILE="scripts/${NUMBER}_check_file_permissions.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_file_permissions.sh
          # Description : Display permissions and ownership
          # ==========================================================

          set -euo pipefail

          FILE="${1:-/etc/passwd}"

          if [ ! -e "$FILE" ]; then
              echo "File does not exist: $FILE"
              exit 1
          fi

          echo "Permissions:"
          ls -l "$FILE"

          echo
          echo "Detailed information:"
          stat "$FILE"
          SCRIPT

              ;;

            # ====================================================
            # 028 - World Writable Files
            # ====================================================

            28)

              FILE="scripts/${NUMBER}_find_world_writable_files.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : find_world_writable_files.sh
          # Description : Find world-writable files
          # ==========================================================

          set -euo pipefail

          DIRECTORY="${1:-.}"

          echo "World-writable files:"
          echo

          find "$DIRECTORY" \
              -type f \
              -perm -0002 \
              -print
          SCRIPT

              ;;

            # ====================================================
            # 029 - Orphaned Files
            # ====================================================

            29)

              FILE="scripts/${NUMBER}_find_orphaned_files.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : find_orphaned_files.sh
          # Description : Find files with missing owners/groups
          # ==========================================================

          set -euo pipefail

          DIRECTORY="${1:-/}"

          echo "Files with missing user ownership:"
          find "$DIRECTORY" \
              -xdev \
              -nouser \
              -print 2>/dev/null || true

          echo
          echo "Files with missing group ownership:"
          find "$DIRECTORY" \
              -xdev \
              -nogroup \
              -print 2>/dev/null || true
          SCRIPT

              ;;

            # ====================================================
            # 030 - Create Backup
            # ====================================================

            30)

              FILE="scripts/${NUMBER}_create_backup.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : create_backup.sh
          # Description : Create timestamped compressed backup
          # ==========================================================

          set -euo pipefail

          SOURCE="${1:-$HOME/Documents}"
          BACKUP_DIR="${2:-$HOME/backups}"

          if [ ! -d "$SOURCE" ]; then
              echo "Source directory does not exist: $SOURCE"
              exit 1
          fi

          mkdir -p "$BACKUP_DIR"

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')

          BACKUP="$BACKUP_DIR/backup_$TIMESTAMP.tar.gz"

          tar -czf "$BACKUP" "$SOURCE"

          echo "Backup created:"
          echo "$BACKUP"
          SCRIPT

              ;;

            # ====================================================
            # 031 - Restore Backup
            # ====================================================

            31)

              FILE="scripts/${NUMBER}_restore_backup.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : restore_backup.sh
          # Description : Restore a compressed backup
          # ==========================================================

          set -euo pipefail

          BACKUP="${1:-}"
          DESTINATION="${2:-.}"

          if [ -z "$BACKUP" ]; then
              echo "Usage: $0 <backup.tar.gz> [destination]"
              exit 1
          fi

          if [ ! -f "$BACKUP" ]; then
              echo "Backup not found: $BACKUP"
              exit 1
          fi

          mkdir -p "$DESTINATION"

          tar -xzf "$BACKUP" \
              -C "$DESTINATION"

          echo "Backup restored successfully."
          SCRIPT

              ;;

            # ====================================================
            # 032 - Backup User Home
            # ====================================================

            32)

              FILE="scripts/${NUMBER}_backup_user_home.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : backup_user_home.sh
          # Description : Backup a user's home directory
          # ==========================================================

          set -euo pipefail

          USER_NAME="${1:-$USER}"
          BACKUP_DIR="${2:-$HOME/backups}"

          USER_HOME=$(getent passwd "$USER_NAME" | cut -d: -f6)

          if [ -z "$USER_HOME" ] || [ ! -d "$USER_HOME" ]; then
              echo "User home directory not found."
              exit 1
          fi

          mkdir -p "$BACKUP_DIR"

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')

          BACKUP="$BACKUP_DIR/${USER_NAME}_$TIMESTAMP.tar.gz"

          tar -czf "$BACKUP" "$USER_HOME"

          echo "User backup created:"
          echo "$BACKUP"
          SCRIPT

              ;;

            # ====================================================
            # 033 - Logged In Users
            # ====================================================

            33)

              FILE="scripts/${NUMBER}_check_logged_in_users.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_logged_in_users.sh
          # Description : Display currently logged-in users
          # ==========================================================

          set -euo pipefail

          echo "Currently logged-in users:"
          echo

          who

          echo
          echo "Logged-in user count:"
          who | wc -l
          SCRIPT

              ;;

            # ====================================================
            # 034 - User Expiry
            # ====================================================

            34)

              FILE="scripts/${NUMBER}_check_user_expiry.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : check_user_expiry.sh
          # Description : Check Linux user account expiration
          # ==========================================================

          set -euo pipefail

          USER_NAME="${1:-$USER}"

          echo "Account information:"
          echo

          chage -l "$USER_NAME"
          SCRIPT

              ;;

            # ====================================================
            # 035 - Create Users
            # ====================================================

            35)

              FILE="scripts/${NUMBER}_create_users_from_file.sh"

              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          # ==========================================================
          # Script Name : create_users_from_file.sh
          # Description : Create Linux users from a text file
          # ==========================================================

          set -euo pipefail

          USER_FILE="${1:-users.txt}"

          if [ ! -f "$USER_FILE" ]; then
              echo "User file not found: $USER_FILE"
              exit 1
          fi

          while IFS= read -r USER_NAME; do

              [ -z "$USER_NAME" ] && continue

              if id "$USER_NAME" >/dev/null 2>&1; then

                  echo "User already exists: $USER_NAME"

              else

