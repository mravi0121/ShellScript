name: Daily ShellScript + GitHub Pages

on:
  schedule:
    # 1:00 AM IST = 19:30 UTC
    - cron: "30 19 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # 2. CONFIGURE GIT
      # =====================================================

      - name: Configure Git
        run: |
          git config user.name "mravi0121"
          git config user.email "ravimishra121299@gmail.com"


      # =====================================================
      # 3. GENERATE NEXT SCRIPT + ARTICLE
      # =====================================================

      - name: Generate next use case
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p scripts
          mkdir -p docs


          # -------------------------------------------------
          # Find the next JSON file
          # -------------------------------------------------

          NEXT_JSON=""

          for JSON_FILE in $(find usecases \
              -maxdepth 1 \
              -type f \
              -name '[0-9][0-9][0-9].json' |
              sort); do

              NUMBER=$(basename "$JSON_FILE" .json)

              SCRIPT_FILE=$(python3 - "$JSON_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          print(data["filename"])
          PY
          )

              if [ ! -f "scripts/$SCRIPT_FILE" ]; then
                  NEXT_JSON="$JSON_FILE"
                  break
              fi

          done


          # -------------------------------------------------
          # Stop if all 51 are completed
          # -------------------------------------------------

          if [ -z "$NEXT_JSON" ]; then

              echo "All 51 use cases have already been generated."

              exit 0

          fi


          echo "Selected JSON:"
          echo "$NEXT_JSON"


          # -------------------------------------------------
          # Read JSON
          # -------------------------------------------------

          eval "$(
            python3 - "$NEXT_JSON" <<'PY'
          import json
          import sys
          import shlex

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          for key in ["id", "title", "description", "filename", "category", "script"]:
              value = data.get(key, "")
              print(f"{key.upper()}={shlex.quote(str(value))}")
          PY
          )"


          echo
          echo "========================================"
          echo "Use Case : $ID"
          echo "Title    : $TITLE"
          echo "Category : $CATEGORY"
          echo "File     : $FILENAME"
          echo "========================================"
          echo


          # =================================================
          # 4. CREATE SHELL SCRIPT
          # =================================================

          SCRIPT_PATH="scripts/$FILENAME"

          printf '%s\n' "$SCRIPT" > "$SCRIPT_PATH"

          chmod +x "$SCRIPT_PATH"


          echo "Created:"
          echo "$SCRIPT_PATH"


          # =================================================
          # 5. VALIDATE SHELL SCRIPT
          # =================================================

          echo
          echo "Validating Shell script..."

          bash -n "$SCRIPT_PATH"

          echo "Shell syntax validation passed."


          # =================================================
          # 6. CREATE HTML ARTICLE
          # =================================================

          HTML_NAME="${FILENAME%.sh}.html"

          HTML_NAME="${HTML_NAME#???_}"

          HTML_NAME="${ID}_$(echo "$TITLE" |
            tr '[:upper:]' '[:lower:]' |
            sed 's/[^a-z0-9]/-/g' |
            sed 's/-\+/-/g' |
            sed 's/^-//' |
            sed 's/-$//').html"


          HTML_PATH="docs/$HTML_NAME"


          # -------------------------------------------------
          # Escape HTML
          # -------------------------------------------------

          ESCAPED_SCRIPT=$(python3 - "$SCRIPT_PATH" <<'PY'
          import html
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              content = f.read()

          print(html.escape(content))
          PY
          )


          ESCAPED_TITLE=$(python3 - "$TITLE" <<'PY'
          import html
          import sys

          print(html.escape(sys.argv[1]))
          PY
          )


          ESCAPED_DESCRIPTION=$(python3 - "$DESCRIPTION" <<'PY'
          import html
          import sys

          print(html.escape(sys.argv[1]))
          PY
          )


          # -------------------------------------------------
          # Generate article
          # -------------------------------------------------

          cat > "$HTML_PATH" <<HTML
          <!DOCTYPE html>

          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width, initial-scale=1.0">

          <meta name="description"
                content="${ESCAPED_DESCRIPTION}">

          <title>${ESCAPED_TITLE}</title>

          <link rel="stylesheet" href="style.css">

          </head>


          <body>

          <main>

          <nav>

          <a href="index.html">
          ← Back to ShellScript
          </a>

          </nav>


          <header>

          <span class="badge">
          Day ${ID}
          </span>

          <h1>${ESCAPED_TITLE}</h1>

          <p class="description">
          ${ESCAPED_DESCRIPTION}
          </p>

          <p class="category">
          Category: ${CATEGORY}
          </p>

          </header>


          <section>

          <h2>Overview</h2>

          <p>
          ${ESCAPED_DESCRIPTION}
          </p>

          </section>


          <section>

          <h2>Shell Script</h2>

          <pre><code>${ESCAPED_SCRIPT}</code></pre>

          </section>


          <section>

          <h2>Use Case</h2>

          <p>
          This script demonstrates a practical Linux,
          Shell scripting and DevOps automation use case.
          </p>

          </section>


          <section>

          <h2>Key Concepts</h2>

          <ul>

          <li>Linux administration</li>

          <li>Shell scripting</li>

          <li>Automation</li>

          <li>Monitoring and troubleshooting</li>

          <li>DevOps practices</li>

          </ul>

          </section>


          <section>

          <h2>Source Code</h2>

          <p>

          The original Shell script is available in the
          GitHub repository.

          </p>

          <a
            class="button"
            href="https://github.com/mravi0121/ShellScript/blob/main/scripts/${FILENAME}"
            target="_blank">

            View Script on GitHub →

          </a>

          </section>


          </main>

          </body>

          </html>
          HTML


          echo
          echo "Created article:"
          echo "$HTML_PATH"


          # =================================================
          # 7. CREATE WEBSITE CSS
          # =================================================

          cat > docs/style.css <<'CSS'

          * {
              box-sizing: border-box;
          }

          body {
              margin: 0;

              font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;

              line-height: 1.7;

              background: #f6f8fa;

              color: #24292f;
          }

          main {
              max-width: 950px;

              margin: 0 auto;

              padding: 50px 25px;
          }

          nav {
              margin-bottom: 35px;
          }

          nav a {
              text-decoration: none;

              color: #0969da;

              font-weight: 600;
          }

          header {
              background: white;

              padding: 35px;

              border-radius: 14px;

              border: 1px solid #d0d7de;

              margin-bottom: 25px;
          }

          h1 {
              font-size: 2.5rem;

              line-height: 1.2;

              margin: 15px 0;
          }

          h2 {
              margin-top: 0;
          }

          section {
              background: white;

              padding: 30px;

              margin: 25px 0;

              border-radius: 14px;

              border: 1px solid #d0d7de;
          }

          .badge {
              display: inline-block;

              padding: 5px 12px;

              border-radius: 20px;

              background: #ddf4ff;

              color: #0969da;

              font-size: 14px;

              font-weight: 600;
          }

          .description {
              font-size: 1.1rem;

              color: #57606a;
          }

          .category {
              font-size: 14px;

              color: #57606a;
          }

          pre {
              background: #161b22;

              color: #f0f6fc;

              padding: 25px;

              border-radius: 10px;

              overflow-x: auto;

              font-size: 14px;

              line-height: 1.6;
          }

          code {
              font-family:
                  "SFMono-Regular",
                  Consolas,
                  "Liberation Mono",
                  monospace;
          }

          .button {
              display: inline-block;

              padding: 10px 18px;

              background: #0969da;

              color: white;

              text-decoration: none;

              border-radius: 7px;

              font-weight: 600;
          }

          li {
              margin: 8px 0;
          }

          @media (max-width: 600px) {

              main {
                  padding: 25px 15px;
              }

              h1 {
                  font-size: 2rem;
              }

              section,
              header {
                  padding: 20px;
              }

          }

          CSS


          # =================================================
          # 8. GENERATE HOMEPAGE
          # =================================================

          cat > docs/index.html <<'HTML'
          <!DOCTYPE html>

          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width, initial-scale=1.0">

          <title>ShellScript | Ravi Mishra</title>

          <link rel="stylesheet" href="style.css">

          </head>


          <body>

          <main>

          <header>

          <span class="badge">
          DevOps Portfolio
          </span>

          <h1>🐚 ShellScript</h1>

          <p class="description">

          Practical Shell Scripting and DevOps
          Automation Use Cases.

          </p>

          <p>

          51 real-world Shell scripting examples covering
          Linux, monitoring, networking, services,
          Docker, Kubernetes, AWS and DevOps automation.

          </p>

          <p>

          <strong>GitHub:</strong>

          <a href="https://github.com/mravi0121/ShellScript"
             target="_blank">

          mravi0121/ShellScript

          </a>

          </p>

          </header>


          <section>

          <h2>Daily Shell Scripts</h2>

          HTML


          # -------------------------------------------------
          # Add articles
          # -------------------------------------------------

          find docs \
            -maxdepth 1 \
            -type f \
            -name '[0-9][0-9][0-9]_*.html' |
            sort -r |
            while read -r ARTICLE; do

              BASENAME=$(basename "$ARTICLE" .html)

              TITLE=$(echo "$BASENAME" |
                sed 's/^[0-9][0-9][0-9]_//' |
                tr '_' ' ' |
                sed 's/\b\(.\)/\u\1/g')


              cat >> docs/index.html <<HTML

          <div class="card">

          <h3>${TITLE}</h3>

          <p>
          Daily Shell scripting and DevOps use case.
          </p>

          <a
            href="${BASENAME}.html">

            Read Article →

          </a>

          </div>

          HTML

          done


          cat >> docs/index.html <<'HTML'

          </section>


          </main>

          </body>

          </html>
          HTML


          # =================================================
          # 9. ADD CARD CSS
          # =================================================

          cat >> docs/style.css <<'CSS'

          .card {
              border: 1px solid #d0d7de;

              border-radius: 10px;

              padding: 20px;

              margin: 18px 0;

              background: #ffffff;
          }

          .card h3 {
              margin-top: 0;
          }

          .card a {
              color: #0969da;

              text-decoration: none;

              font-weight: 600;
          }

          CSS


          # =================================================
          # 10. UPDATE README
          # =================================================

          SCRIPT_COUNT=$(find scripts \
              -maxdepth 1 \
              -type f \
              -name '[0-9][0-9][0-9]_*.sh' |
              wc -l)


          cat > README.md <<EOF
          # 🐚 ShellScript

          Practical Shell Scripting and DevOps Automation.

          ## Progress

          **${SCRIPT_COUNT}/51 use cases completed**

          ## Topics

          - Linux
          - Shell Scripting
          - Monitoring
          - Networking
          - Service Management
          - Log Management
          - Backup
          - Security
          - Git
          - Docker
          - Kubernetes
          - AWS
          - DevOps Automation

          ## GitHub Pages

          https://mravi0121.github.io/ShellScript/

          ## Repository

          https://github.com/mravi0121/ShellScript

          ## Author

          Ravi Mishra

          GitHub: https://github.com/mravi0121

          EOF


          # =================================================
          # 11. SHOW GENERATED FILES
          # =================================================

          echo
          echo "========================================"
          echo "Generated Files"
          echo "========================================"

          echo

          find scripts \
            -maxdepth 1 \
            -type f |
            sort

          echo

          find docs \
            -maxdepth 1 \
            -type f |
            sort


      # =====================================================
      # 12. COMMIT
      # =====================================================

      - name: Commit changes
        shell: bash
        run: |

          set -euo pipefail

          git add scripts/
          git add docs/
          git add README.md

          if git diff --cached --quiet; then

              echo "No changes to commit."

              exit 0

          fi


          SCRIPT=$(git diff --cached \
              --name-only |
              grep '^scripts/.*\.sh$' |
              head -1 || true)


          if [ -n "$SCRIPT" ]; then

              SCRIPT_NAME=$(basename "$SCRIPT" .sh)

              git commit \
                -m "Add daily ShellScript: ${SCRIPT_NAME}"

          else

              git commit \
                -m "Update ShellScript website"

          fi


      # =====================================================
      # 13. PUSH
      # =====================================================

      - name: Push changes
        run: |

          git push


  # ========================================================
  # GITHUB PAGES DEPLOYMENT
  # ========================================================

  deploy:

    needs: generate

    runs-on: ubuntu-latest

    permissions:

      contents: read

      pages: write

      id-token: write

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:


      # ----------------------------------------------------
      # Checkout latest repository
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Configure Pages
      # ----------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # ----------------------------------------------------
      # Upload docs/
      # ----------------------------------------------------

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs


      # ----------------------------------------------------
      # Deploy
      # ----------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
