name: Daily Shell Script

on:
  schedule:
    - cron: "30 19 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-shell-script:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "mravi0121"
          git config user.email "ravimishra121299@gmail.com"

      - name: Generate next script
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts

          COUNT=$(find scripts -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sh' | wc -l)
          NEXT=$((COUNT + 1))

          echo "Existing scripts: $COUNT"
          echo "Next script: $NEXT"

          if [ "$NEXT" -gt 51 ]; then
            echo "All 51 scripts have already been created."
            exit 0
          fi

          NUMBER=$(printf "%03d" "$NEXT")

          case "$NEXT" in

            1)
              FILE="scripts/${NUMBER}_check_disk_usage.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          THRESHOLD="${1:-80}"

          df -hP | awk -v threshold="$THRESHOLD" '
          NR > 1 {
              usage=$5
              gsub("%","",usage)

              if (usage >= threshold)
                  print "WARNING: " $6 " is " usage "% full"
              else
                  print "OK: " $6 " is " usage "% full"
          }'
          SCRIPT
              ;;

            2)
              FILE="scripts/${NUMBER}_check_cpu_usage.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          CPU_USAGE=$(top -bn1 | awk '/Cpu\(s\)/ {
              print 100 - $8
          }')

          echo "CPU Usage: ${CPU_USAGE}%"
          SCRIPT
              ;;

            3)
              FILE="scripts/${NUMBER}_check_memory_usage.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          free -h

          MEMORY_USAGE=$(free | awk '/Mem:/ {
              printf "%.0f", ($3/$2)*100
          }')

          echo
          echo "Memory Usage: ${MEMORY_USAGE}%"

          if [ "$MEMORY_USAGE" -ge 80 ]; then
              echo "WARNING: Memory usage is above 80%"
          else
              echo "OK: Memory usage is normal"
          fi
          SCRIPT
              ;;

            4)
              FILE="scripts/${NUMBER}_check_load_average.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          echo "System Load:"
          uptime

          echo
          cat /proc/loadavg
          SCRIPT
              ;;

            5)
              FILE="scripts/${NUMBER}_check_uptime.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          echo "System Uptime:"
          uptime -p

          echo
          echo "Boot Time:"
          uptime -s
          SCRIPT
              ;;

            6)
              FILE="scripts/${NUMBER}_top_cpu_processes.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          ps aux --sort=-%cpu | head -11
          SCRIPT
              ;;

            7)
              FILE="scripts/${NUMBER}_top_memory_processes.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          ps aux --sort=-%mem | head -11
          SCRIPT
              ;;

            8)
              FILE="scripts/${NUMBER}_kill_process.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          PID="${1:-}"

          if [ -z "$PID" ]; then
              echo "Usage: $0 <PID>"
              exit 1
          fi

          if ! kill -0 "$PID" 2>/dev/null; then
              echo "Process $PID does not exist."
              exit 1
          fi

          kill "$PID"

          echo "Termination signal sent to process $PID."
          SCRIPT
              ;;

            9)
              FILE="scripts/${NUMBER}_check_service_status.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          SERVICE="${1:-ssh}"

          if systemctl is-active --quiet "$SERVICE"; then
              echo "SUCCESS: $SERVICE is running."
          else
              echo "ERROR: $SERVICE is not running."
              systemctl status "$SERVICE" --no-pager || true
              exit 1
          fi
          SCRIPT
              ;;

            10)
              FILE="scripts/${NUMBER}_auto_restart_tomcat.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          SERVICE="${1:-tomcat}"
          LOG_FILE="${2:-/tmp/tomcat-auto-restart.log}"

          log() {
              echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" | tee -a "$LOG_FILE"
          }

          log "Checking $SERVICE service."

          if systemctl is-active --quiet "$SERVICE"; then
              log "$SERVICE is running."
              exit 0
          fi

          log "$SERVICE is down."
          log "Attempting to restart $SERVICE."

          systemctl restart "$SERVICE"

          sleep 10

          if systemctl is-active --quiet "$SERVICE"; then
              log "$SERVICE restarted successfully."
              exit 0
          fi

          log "ERROR: Failed to restart $SERVICE."

          systemctl status "$SERVICE" --no-pager >> "$LOG_FILE" 2>&1 || true

          exit 1
          SCRIPT
              ;;

            11)
              FILE="scripts/${NUMBER}_check_failed_services.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          systemctl --failed --no-pager
          SCRIPT
              ;;

            12)
              FILE="scripts/${NUMBER}_check_open_ports.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          ss -tuln
          SCRIPT
              ;;

            13)
              FILE="scripts/${NUMBER}_check_network_connectivity.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          HOST="${1:-google.com}"

          if ping -c 3 "$HOST" >/dev/null 2>&1; then
              echo "SUCCESS: $HOST is reachable."
          else
              echo "ERROR: $HOST is unreachable."
              exit 1
          fi
          SCRIPT
              ;;

            14)
              FILE="scripts/${NUMBER}_check_dns_resolution.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DOMAIN="${1:-google.com}"

          if getent hosts "$DOMAIN"; then
              echo "SUCCESS: DNS resolution works for $DOMAIN."
          else
              echo "ERROR: DNS resolution failed for $DOMAIN."
              exit 1
          fi
          SCRIPT
              ;;

            15)
              FILE="scripts/${NUMBER}_check_http_endpoint.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          URL="${1:-https://example.com}"

          HTTP_STATUS=$(curl -L -s \
              -o /dev/null \
              -w "%{http_code}" \
              "$URL")

          echo "URL: $URL"
          echo "HTTP Status: $HTTP_STATUS"

          if [[ "$HTTP_STATUS" =~ ^[23][0-9][0-9]$ ]]; then
              echo "SUCCESS: Endpoint is healthy."
          else
              echo "ERROR: Endpoint returned HTTP $HTTP_STATUS."
              exit 1
          fi
          SCRIPT
              ;;

            16)
              FILE="scripts/${NUMBER}_find_large_files.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DIRECTORY="${1:-.}"
          SIZE="${2:-100M}"

          find "$DIRECTORY" \
              -type f \
              -size +"$SIZE" \
              -exec ls -lh {} \;
          SCRIPT
              ;;

            17)
              FILE="scripts/${NUMBER}_find_recent_files.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DIRECTORY="${1:-.}"

          find "$DIRECTORY" \
              -type f \
              -mtime -1 \
              -print
          SCRIPT
              ;;

            18)
              FILE="scripts/${NUMBER}_find_old_files.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DIRECTORY="${1:-.}"
          DAYS="${2:-30}"

          find "$DIRECTORY" \
              -type f \
              -mtime +"$DAYS" \
              -print
          SCRIPT
              ;;

            19)
              FILE="scripts/${NUMBER}_cleanup_old_logs.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          LOG_DIR="${1:-/var/log}"
          DAYS="${2:-30}"

          find "$LOG_DIR" \
              -type f \
              -name "*.log" \
              -mtime +"$DAYS" \
              -print
          SCRIPT
              ;;

            20)
              FILE="scripts/${NUMBER}_archive_logs.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          LOG_DIR="${1:-/tmp/logs}"
          OUTPUT_DIR="${2:-$HOME/log-archives}"

          if [ ! -d "$LOG_DIR" ]; then
              echo "Directory not found: $LOG_DIR"
              exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          ARCHIVE="$OUTPUT_DIR/logs_$TIMESTAMP.tar.gz"

          tar -czf "$ARCHIVE" "$LOG_DIR"

          echo "Archive created:"
          echo "$ARCHIVE"
          SCRIPT
              ;;

            21)
              FILE="scripts/${NUMBER}_search_error_logs.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          LOG_FILE="${1:-/var/log/syslog}"

          if [ ! -f "$LOG_FILE" ]; then
              echo "Log file not found: $LOG_FILE"
              exit 1
          fi

          grep -Ei "error|warn|failed|critical" "$LOG_FILE" || true
          SCRIPT
              ;;

            22)
              FILE="scripts/${NUMBER}_monitor_log_file.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          LOG_FILE="${1:-/var/log/syslog}"

          if [ ! -f "$LOG_FILE" ]; then
              echo "Log file not found: $LOG_FILE"
              exit 1
          fi

          tail -F "$LOG_FILE" | grep --line-buffered -Ei "error|failed|critical"
          SCRIPT
              ;;

            23)
              FILE="scripts/${NUMBER}_analyze_http_status_codes.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          LOG_FILE="${1:-access.log}"

          if [ ! -f "$LOG_FILE" ]; then
              echo "Log file not found: $LOG_FILE"
              exit 1
          fi

          awk '{
              for (i=1; i<=NF; i++)
                  if ($i ~ /^[1-5][0-9][0-9]$/)
                      print $i
          }' "$LOG_FILE" |
          sort |
          uniq -c |
          sort -nr
          SCRIPT
              ;;

            24)
              FILE="scripts/${NUMBER}_check_failed_ssh_logins.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if [ -f /var/log/auth.log ]; then
              grep "Failed password" /var/log/auth.log || true
          elif [ -f /var/log/secure ]; then
              grep "Failed password" /var/log/secure || true
          else
              echo "Authentication log not found."
          fi
          SCRIPT
              ;;

            25)
              FILE="scripts/${NUMBER}_check_inode_usage.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          df -ih
          SCRIPT
              ;;

            26)
              FILE="scripts/${NUMBER}_find_large_directories.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DIRECTORY="${1:-.}"

          du -h --max-depth=1 "$DIRECTORY" 2>/dev/null |
          sort -hr |
          head -20
          SCRIPT
              ;;

            27)
              FILE="scripts/${NUMBER}_check_file_permissions.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          FILE="${1:-/etc/passwd}"

          if [ ! -e "$FILE" ]; then
              echo "File does not exist: $FILE"
              exit 1
          fi

          ls -l "$FILE"
          stat "$FILE"
          SCRIPT
              ;;

            28)
              FILE="scripts/${NUMBER}_find_world_writable_files.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DIRECTORY="${1:-.}"

          find "$DIRECTORY" \
              -type f \
              -perm -0002 \
              -print
          SCRIPT
              ;;

            29)
              FILE="scripts/${NUMBER}_find_orphaned_files.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DIRECTORY="${1:-/}"

          find "$DIRECTORY" -xdev -nouser -print 2>/dev/null || true

          find "$DIRECTORY" -xdev -nogroup -print 2>/dev/null || true
          SCRIPT
              ;;

            30)
              FILE="scripts/${NUMBER}_create_backup.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          SOURCE="${1:-$HOME/Documents}"
          BACKUP_DIR="${2:-$HOME/backups}"

          if [ ! -d "$SOURCE" ]; then
              echo "Source directory does not exist."
              exit 1
          fi

          mkdir -p "$BACKUP_DIR"

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          BACKUP="$BACKUP_DIR/backup_$TIMESTAMP.tar.gz"

          tar -czf "$BACKUP" "$SOURCE"

          echo "Backup created: $BACKUP"
          SCRIPT
              ;;

            31)
              FILE="scripts/${NUMBER}_restore_backup.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          BACKUP="${1:-}"
          DESTINATION="${2:-.}"

          if [ -z "$BACKUP" ]; then
              echo "Usage: $0 <backup.tar.gz> [destination]"
              exit 1
          fi

          if [ ! -f "$BACKUP" ]; then
              echo "Backup not found."
              exit 1
          fi

          mkdir -p "$DESTINATION"

          tar -xzf "$BACKUP" -C "$DESTINATION"

          echo "Backup restored successfully."
          SCRIPT
              ;;

            32)
              FILE="scripts/${NUMBER}_backup_user_home.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          USER_NAME="${1:-$USER}"
          BACKUP_DIR="${2:-$HOME/backups}"

          USER_HOME=$(getent passwd "$USER_NAME" | cut -d: -f6)

          if [ -z "$USER_HOME" ] || [ ! -d "$USER_HOME" ]; then
              echo "User home directory not found."
              exit 1
          fi

          mkdir -p "$BACKUP_DIR"

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          BACKUP="$BACKUP_DIR/${USER_NAME}_$TIMESTAMP.tar.gz"

          tar -czf "$BACKUP" "$USER_HOME"

          echo "Backup created: $BACKUP"
          SCRIPT
              ;;

            33)
              FILE="scripts/${NUMBER}_check_logged_in_users.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          who

          echo
          echo "User count:"
          who | wc -l
          SCRIPT
              ;;

            34)
              FILE="scripts/${NUMBER}_check_user_expiry.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          USER_NAME="${1:-$USER}"

          chage -l "$USER_NAME"
          SCRIPT
              ;;

            35)
              FILE="scripts/${NUMBER}_create_users_from_file.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          USER_FILE="${1:-users.txt}"

          if [ ! -f "$USER_FILE" ]; then
              echo "User file not found."
              exit 1
          fi

          while IFS= read -r USER_NAME; do

              [ -z "$USER_NAME" ] && continue

              if id "$USER_NAME" >/dev/null 2>&1; then
                  echo "User already exists: $USER_NAME"
              else
                  sudo useradd -m "$USER_NAME"
                  echo "Created user: $USER_NAME"
              fi

          done < "$USER_FILE"
          SCRIPT
              ;;

            36)
              FILE="scripts/${NUMBER}_system_information.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          echo "Hostname:"
          hostname

          echo
          echo "Operating System:"
          grep PRETTY_NAME /etc/os-release

          echo
          echo "Kernel:"
          uname -r

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Uptime:"
          uptime -p
          SCRIPT
              ;;

            37)
              FILE="scripts/${NUMBER}_check_installed_packages.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if command -v dpkg >/dev/null 2>&1; then
              dpkg --get-selections
          elif command -v rpm >/dev/null 2>&1; then
              rpm -qa
          else
              echo "Unsupported package manager."
              exit 1
          fi
          SCRIPT
              ;;

            38)
              FILE="scripts/${NUMBER}_check_environment_variables.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          printenv | sort
          SCRIPT
              ;;

            39)
              FILE="scripts/${NUMBER}_validate_environment_variables.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          REQUIRED_VARS=(
              "APP_ENV"
              "APP_NAME"
              "AWS_REGION"
          )

          MISSING=0

          for VAR in "${REQUIRED_VARS[@]}"; do
              if [ -z "${!VAR:-}" ]; then
                  echo "ERROR: $VAR is not set."
                  MISSING=1
              else
                  echo "OK: $VAR is configured."
              fi
          done

          [ "$MISSING" -eq 0 ]
          SCRIPT
              ;;

            40)
              FILE="scripts/${NUMBER}_git_status_check.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if [ ! -d ".git" ]; then
              echo "Not a Git repository."
              exit 1
          fi

          git status --short

          echo
          echo "Current branch:"
          git branch --show-current
          SCRIPT
              ;;

            41)
              FILE="scripts/${NUMBER}_find_git_changes.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
              echo "Working tree is clean."
          else
              echo "Uncommitted changes:"
              git status --short
          fi
          SCRIPT
              ;;

            42)
              FILE="scripts/${NUMBER}_git_backup.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          BRANCH="backup/$TIMESTAMP"

          git switch -c "$BRANCH"

          echo "Backup branch created:"
          echo "$BRANCH"
          SCRIPT
              ;;

            43)
              FILE="scripts/${NUMBER}_docker_container_health.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed."
              exit 1
          fi

          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          SCRIPT
              ;;

            44)
              FILE="scripts/${NUMBER}_cleanup_docker_containers.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed."
              exit 1
          fi

          docker container prune -f
          SCRIPT
              ;;

            45)
              FILE="scripts/${NUMBER}_cleanup_docker_images.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed."
              exit 1
          fi

          docker image prune -f
          SCRIPT
              ;;

            46)
              FILE="scripts/${NUMBER}_kubernetes_pod_health.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          NAMESPACE="${1:-default}"

          if ! command -v kubectl >/dev/null 2>&1; then
              echo "kubectl is not installed."
              exit 1
          fi

          kubectl get pods -n "$NAMESPACE"

          echo
          echo "Non-running pods:"

          kubectl get pods \
              -n "$NAMESPACE" \
              --field-selector=status.phase!=Running \
              --no-headers || true
          SCRIPT
              ;;

            47)
              FILE="scripts/${NUMBER}_kubernetes_node_health.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          if ! command -v kubectl >/dev/null 2>&1; then
              echo "kubectl is not installed."
              exit 1
          fi

          kubectl get nodes -o wide
          SCRIPT
              ;;

            48)
              FILE="scripts/${NUMBER}_restart_unhealthy_kubernetes_deployment.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          DEPLOYMENT="${1:-}"
          NAMESPACE="${2:-default}"

          if [ -z "$DEPLOYMENT" ]; then
              echo "Usage: $0 <deployment> [namespace]"
              exit 1
          fi

          READY=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.readyReplicas}')

          DESIRED=$(kubectl get deployment "$DEPLOYMENT" \
              -n "$NAMESPACE" \
              -o jsonpath='{.spec.replicas}')

          READY="${READY:-0}"
          DESIRED="${DESIRED:-0}"

          echo "Ready replicas: $READY"
          echo "Desired replicas: $DESIRED"

          if [ "$READY" -lt "$DESIRED" ]; then
              echo "Deployment is unhealthy."
              kubectl rollout restart deployment "$DEPLOYMENT" -n "$NAMESPACE"
              kubectl rollout status deployment "$DEPLOYMENT" -n "$NAMESPACE"
          else
              echo "Deployment is healthy."
          fi
          SCRIPT
              ;;

            49)
              FILE="scripts/${NUMBER}_check_ec2_status.sh"
              cat > "$FILE" <<'SCRIPT'
          #!/bin/bash

          set -euo pipefail

          REGION="${1:-}"

          if [ -z "$REGION" ]; then
              echo "Usage: $0 <aws-region>"
              exit 1
          fi

          if ! command -v aws >/dev/null 2>&1; then
              echo "AWS CLI is not installed."
              exit 1
          fi

          aws ec2 describe-instances \
              --region "$REGION" \
              --query 'Reservations[].Instances[].[InstanceId,State.Name,PrivateIpAddress]' \
              --output table
          SCRIPT
              ;;

            50)
